<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Lingo — Learn, Play, Grow.</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3FB6FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Little Lingo">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#3FB6FF;
    --sky-deep:#1E93E0;
    --purple:#8B6BFF;
    --purple-deep:#6B46E5;
    --yellow:#FFC93C;
    --green:#3ECF8E;
    --orange:#FF9F4A;
    --red:#FF6B6B;
    --pink:#FF6FB5;
    --pink-deep:#E8479A;
    --teal:#2DD4C8;
    --teal-deep:#14B8AE;
    --bg:#E7DFFF;
    --bg-card:linear-gradient(150deg, #FFFFFF 0%, #F3EEFF 55%, #E8F7FF 100%);
    --ink:#2B2350;
    --ink-soft:#6B6690;
    --radius:22px;
    --shadow: 0 10px 30px rgba(80,90,200,0.14);
    --font-display:'Fredoka', system-ui, sans-serif;
    --font-body:'Nunito', system-ui, sans-serif;
  }
  .dark{
    --bg:#1E1642;
    --bg-card:linear-gradient(150deg, #2A2358 0%, #241D52 55%, #1E2C4E 100%);
    --ink:#F1EEFF;
    --ink-soft:#B4ABE0;
    --shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:var(--font-body);
    background:
      radial-gradient(circle at 8% 8%, rgba(63,182,255,0.24), transparent 42%),
      radial-gradient(circle at 92% 15%, rgba(139,107,255,0.42), transparent 45%),
      radial-gradient(circle at 15% 55%, rgba(255,111,181,0.26), transparent 40%),
      radial-gradient(circle at 85% 60%, rgba(45,212,200,0.18), transparent 40%),
      radial-gradient(circle at 50% 95%, rgba(255,201,60,0.2), transparent 42%),
      radial-gradient(circle at 50% 40%, rgba(139,107,255,0.18), transparent 60%),
      var(--bg);
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
    transition:background 0.4s ease, color 0.4s ease;
  }
  #app{ max-width:520px; margin:0 auto; min-height:100vh; position:relative; padding-bottom:90px; }
  h1,h2,h3{ font-family:var(--font-display); margin:0; }
  .screen{ padding:22px 20px 10px; animation:fadeIn .45s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

  /* Floating shapes */
  .float-shape{ position:fixed; border-radius:50%; opacity:0.35; z-index:0; pointer-events:none; animation:floaty 8s ease-in-out infinite; }
  .sparkle{ position:fixed; font-size:22px; z-index:0; pointer-events:none; animation:sparkleFloat 4s ease-in-out infinite; opacity:0.8; }
  @keyframes sparkleFloat{ 0%,100%{ transform:translateY(0) rotate(0deg) scale(1); filter:drop-shadow(0 0 0 rgba(255,255,255,0)); } 50%{ transform:translateY(-14px) rotate(15deg) scale(1.15); filter:drop-shadow(0 0 8px rgba(255,255,255,0.9)); } }
  @keyframes floaty{ 0%,100%{transform:translateY(0) rotate(0deg);} 50%{transform:translateY(-18px) rotate(10deg);} }
  @keyframes floatyPulseShine{
    0%,100%{
      transform:translateY(0) rotate(0deg) scale(0.82); opacity:0.26;
      filter:brightness(1) saturate(1);
      box-shadow:0 0 0 0 rgba(255,255,255,0);
    }
    50%{
      transform:translateY(-20px) rotate(12deg) scale(1.3); opacity:0.6;
      filter:brightness(1.6) saturate(1.3);
      box-shadow:0 0 30px 12px rgba(255,255,255,0.55), 0 0 55px 22px currentColor;
    }
  }
  .float-shape.pulse-shine{ animation:floatyPulseShine 4.5s ease-in-out infinite; color:inherit; }

  button{ font-family:var(--font-body); cursor:pointer; border:none; }
  .btn{
    display:block; width:100%; padding:16px; border-radius:18px; font-weight:800; font-size:17px;
    font-family:var(--font-display); letter-spacing:.3px; transition:transform .15s ease, box-shadow .15s ease;
    box-shadow:var(--shadow);
  }
  .btn:active{ transform:scale(0.97); }
  .btn-primary{ background:linear-gradient(135deg,var(--sky),var(--purple)); color:white; box-shadow:0 10px 24px rgba(63,182,255,0.4); }
  .btn-secondary{ background:linear-gradient(135deg,var(--pink),var(--purple-deep)); color:white; box-shadow:0 10px 24px rgba(232,71,154,0.35); }
  .btn-ghost{ background:transparent; color:var(--ink-soft); box-shadow:none; font-weight:700; padding:10px; }
  .btn-yellow{ background:linear-gradient(135deg,#FFD766,var(--yellow)); color:#4A3A00; box-shadow:0 10px 24px rgba(255,201,60,0.35); }

  input, select{
    width:100%; padding:14px 16px; border-radius:16px; border:2px solid rgba(232,71,154,0.22);
    background:linear-gradient(135deg, rgba(255,111,181,0.12), rgba(255,159,74,0.08)), #FFFFFF;
    color:#2B2350; font-family:var(--font-body); font-size:15px; margin-bottom:12px;
    outline:none; transition:border .2s ease, box-shadow .2s ease;
  }
  input::placeholder{ color:#8A80A8; }
  input:focus, select:focus{ border-color:var(--pink-deep); box-shadow:0 0 0 4px rgba(232,71,154,0.14); }

  .pw-field{ position:relative; }
  .pw-field input{ padding-right:48px; margin-bottom:0; }
  .pw-eye{ position:absolute; right:6px; top:50%; transform:translateY(-50%); background:transparent; font-size:18px; padding:8px; }
  .pw-strength-track{ height:6px; border-radius:6px; background:rgba(139,107,255,0.12); margin:8px 0 4px; overflow:hidden; }
  .pw-strength-fill{ height:100%; border-radius:6px; transition:width .3s ease, background .3s ease; width:0%; }
  .pw-strength-fill.pw-empty{ width:0%; }
  .pw-strength-fill.pw-weak{ width:25%; background:var(--red); }
  .pw-strength-fill.pw-fair{ width:50%; background:var(--orange); }
  .pw-strength-fill.pw-good{ width:75%; background:var(--yellow); }
  .pw-strength-fill.pw-strong{ width:100%; background:var(--green); }
  .pw-strength-label{ font-size:11px; font-weight:700; color:var(--ink-soft); margin-bottom:12px; }
  .generated-pw-box{
    background:rgba(62,207,142,0.1); border:2px dashed var(--green); border-radius:14px; padding:12px 14px; margin-bottom:12px;
    animation:popIn 0.3s ease;
  }
  .generated-pw-value{
    font-family:'Courier New', monospace; font-weight:800; font-size:16px; letter-spacing:1px; color:#1F9C64; word-break:break-all;
  }

  h2{ letter-spacing:.2px; }
  .card{
    background:linear-gradient(135deg, rgba(63,182,255,0.14), rgba(139,107,255,0.12) 55%, rgba(255,111,181,0.10)), var(--bg-card);
    border-radius:var(--radius); box-shadow:var(--shadow); padding:18px;
  }
  .card.auth-card{
    background:linear-gradient(150deg, #FFE9F4 0%, #FFD6EA 55%, #FFC9E3 100%);
    border-color:rgba(232,71,154,0.18);
  }
  .card.auth-card .pw-strength-label{ color:#8A5170; }
  .card, .stat-chip, .subject-card, .question-card{ border:2px solid rgba(139,107,255,0.08); }
  .subject-card{ position:relative; }
  .subject-card::before{
    content:''; position:absolute; inset:0; border-radius:20px; padding:2px;
    background:linear-gradient(135deg,var(--sky),var(--purple),var(--yellow));
    -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude; opacity:0; transition:opacity .2s ease;
  }
  .subject-card:active::before{ opacity:1; }

  /* Login mascot */
  .mascot{
    width:120px; height:120px; margin:10px auto 4px; position:relative;
    animation:bob 3s ease-in-out infinite;
  }
  @keyframes bob{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-10px);} }

  .logo-word{
    text-align:center; font-size:36px; font-weight:700; margin:6px 0 0; letter-spacing:.3px;
    background:linear-gradient(135deg,var(--sky-deep),var(--purple),var(--sky-deep));
    background-size:200% auto;
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    animation:shimmer 4s linear infinite;
  }
  .tagline{ text-align:center; color:var(--ink-soft); font-weight:700; margin-bottom:18px; }

  .tabs{ display:flex; gap:10px; margin-bottom:16px; background:rgba(139,107,255,0.06); padding:5px; border-radius:16px; }
  .tab{ flex:1; text-align:center; padding:10px; border-radius:12px; font-weight:800; color:var(--ink-soft); background:transparent; transition:all .25s ease; }
  .tab.active{ background:linear-gradient(135deg,var(--sky),var(--purple),var(--pink)); color:white; box-shadow:0 6px 16px rgba(139,107,255,0.3); }

  /* Home */
  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .greet{ font-size:22px; }
  .avatar-circle{
    width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,var(--yellow),var(--pink)); font-size:26px; box-shadow:var(--shadow);
  }
  .profile-avatar-big{
    width:88px; height:88px; margin:0 auto 8px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,var(--yellow),var(--pink),var(--purple)); font-size:46px; box-shadow:var(--shadow);
    animation:bob 3.5s ease-in-out infinite; cursor:pointer;
  }
  .avatar-picker{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
  .avatar-option{
    width:52px; height:52px; border-radius:50%; font-size:26px; display:flex; align-items:center; justify-content:center;
    background:rgba(139,107,255,0.08); border:2.5px solid transparent; transition:all .15s ease;
  }
  .avatar-option.selected{ border-color:var(--purple); background:linear-gradient(135deg,var(--yellow),var(--pink)); transform:scale(1.08); }
  .avatar-option:active{ transform:scale(0.9); }
  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:16px 0; }
  .stat-chip{
    background:linear-gradient(135deg, rgba(45,212,200,0.14), rgba(139,107,255,0.10)), var(--bg-card);
    border-radius:16px; padding:14px; box-shadow:var(--shadow); text-align:center;
  }
  .stat-chip.c-coin{ background:linear-gradient(135deg,#FFF3D0,#FFE08A); }
  .stat-chip.c-streak{ background:linear-gradient(135deg,#FFE3DA,#FFC1A8); }
  .stat-chip.c-stars{ background:linear-gradient(135deg,#F1F0FF,#E1DBFF); }
  .stat-chip.c-badges{ background:linear-gradient(135deg,#DFFBEE,#BEF3D6); }
  .stat-chip.c-coin .val, .stat-chip.c-coin .lbl,
  .stat-chip.c-streak .val, .stat-chip.c-streak .lbl,
  .stat-chip.c-stars .val, .stat-chip.c-stars .lbl,
  .stat-chip.c-badges .val, .stat-chip.c-badges .lbl{ color:#2B2350; }
  .stat-chip .val{ font-family:var(--font-display); font-size:22px; font-weight:700; }
  .stat-chip .lbl{ font-size:12px; color:var(--ink-soft); font-weight:700; text-transform:uppercase; letter-spacing:.5px; }
  .progress-track{ background:rgba(139,107,255,0.14); border-radius:20px; height:14px; overflow:hidden; margin-top:6px; }
  .progress-fill{ height:100%; background:linear-gradient(90deg,var(--sky),var(--purple)); border-radius:20px; transition:width .6s ease; }

  /* Subjects grid */
  .subject-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px; }
  .subject-card{
    background:linear-gradient(155deg, #DCF3FF 0%, #EAE4FF 50%, #FFE3F2 100%);
    border-radius:20px; padding:18px 12px 14px; text-align:center; box-shadow:var(--shadow);
    transition:transform .18s ease; position:relative; overflow:hidden;
  }
  .subject-card:active{ transform:scale(0.95); }
  .subject-card .icon-badge{
    width:52px; height:52px; border-radius:16px; display:flex; align-items:center; justify-content:center;
    margin:0 auto 8px; font-size:26px; box-shadow:0 4px 10px rgba(80,90,200,0.15);
  }
  .icon-badge.c-sky{ background:linear-gradient(135deg,#DFF3FF,#B8E5FF); }
  .icon-badge.c-purple{ background:linear-gradient(135deg,#EDE7FF,#D9CCFF); }
  .icon-badge.c-green{ background:linear-gradient(135deg,#DFFBEE,#BEF3D6); }
  .icon-badge.c-orange{ background:linear-gradient(135deg,#FFEBDA,#FFD3AE); }
  .icon-badge.c-pink{ background:linear-gradient(135deg,#FFE3F0,#FFC1DD); }
  .icon-badge.c-teal{ background:linear-gradient(135deg,#D9FBF7,#A8EFE8); }
  .subject-card .name{ font-family:var(--font-display); font-weight:600; font-size:14px; color:#2B2350; }
  .subject-card .stars{ font-size:11px; color:var(--yellow); margin-top:4px; font-weight:800; }
  .subject-card .diff-badge{
    position:absolute; top:8px; right:8px; font-size:9px; font-weight:800; padding:3px 7px; border-radius:8px;
    background:rgba(139,107,255,0.12); color:var(--purple-deep);
  }

  /* Quiz */
  .quiz-header{ display:flex; justify-content:space-between; align-items:center; font-weight:800; font-size:13px; color:var(--ink-soft); margin-bottom:8px; }
  .quiz-progress{ background:rgba(139,107,255,0.14); border-radius:20px; height:10px; overflow:hidden; margin-bottom:16px; }
  .timer-pill{ background:var(--orange); color:white; padding:4px 12px; border-radius:20px; font-weight:800; }
  .question-card{
    background:linear-gradient(135deg, rgba(63,182,255,0.14), rgba(255,111,181,0.10)), var(--bg-card);
    border-radius:var(--radius); box-shadow:var(--shadow); padding:22px 18px; margin-bottom:18px; min-height:90px; display:flex; align-items:center;
  }
  .question-card h3{ font-size:19px; line-height:1.4; }
  .option-btn{
    display:block; width:100%; text-align:left; padding:15px 16px; margin-bottom:10px; border-radius:16px;
    background:linear-gradient(135deg, rgba(139,107,255,0.08), rgba(45,212,200,0.08)), var(--bg-card);
    box-shadow:var(--shadow); font-weight:700; font-size:15px; color:var(--ink);
    border:2.5px solid transparent; transition:all .18s ease;
  }
  .option-btn:active{ transform:scale(0.98); }
  .option-btn.correct{ background:linear-gradient(135deg,#5EE0A0,var(--green)); color:white; border-color:var(--green); animation:pulse .4s ease; }
  .option-btn.wrong{ background:linear-gradient(135deg,#FF8A8A,var(--red)); color:white; border-color:var(--red); animation:shake .4s ease; }
  .option-btn.dim{ opacity:0.45; }
  @keyframes pulse{ 0%{transform:scale(1);} 50%{transform:scale(1.04);} 100%{transform:scale(1);} }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }
  .explain-box{ background:rgba(63,182,255,0.1); border-radius:14px; padding:12px 14px; font-size:14px; color:var(--ink-soft); margin-top:6px; }
  .result-banner{
    text-align:center; font-family:var(--font-display); font-weight:600; font-size:17px;
    padding:12px; border-radius:16px; margin-bottom:8px; animation:bannerPop .35s ease;
  }
  @keyframes bannerPop{ from{opacity:0; transform:scale(0.9);} to{opacity:1; transform:scale(1);} }
  .correct-banner{ background:rgba(62,207,142,0.16); color:#1F9C64; }
  .wrong-banner{ background:rgba(255,107,107,0.14); color:#E14545; }
  .code-editor{
    width:100%; min-height:180px; border-radius:16px; padding:14px; font-family:'Courier New', monospace;
    font-size:13.5px; line-height:1.5; background:#1E1B3A; color:#E8E6FF; border:2.5px solid rgba(139,107,255,0.25);
    resize:vertical; margin-bottom:14px; tab-size:2;
  }
  .code-editor:focus{ outline:none; border-color:var(--purple); }
  .code-editor[readonly]{ opacity:0.75; }

  /* Completion */
  .trophy{ font-size:80px; text-align:center; display:block; margin:6px 0; animation:trophyPop .6s ease; }
  @keyframes trophyPop{ 0%{transform:scale(0) rotate(-20deg);} 60%{transform:scale(1.2) rotate(8deg);} 100%{transform:scale(1) rotate(0);} }
  .score-big{
    text-align:center; font-family:var(--font-display); font-size:52px; font-weight:700;
    background:linear-gradient(135deg,var(--sky-deep),var(--purple),var(--pink-deep));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .score-sub{ text-align:center; color:var(--ink-soft); font-weight:700; margin-bottom:14px; }
  .result-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:16px 0; }
  .result-chip{
    background:linear-gradient(135deg, rgba(255,201,60,0.14), rgba(139,107,255,0.10)), var(--bg-card);
    border-radius:14px; padding:12px; text-align:center; box-shadow:var(--shadow);
  }
  .result-chip .n{ font-weight:800; font-size:18px; font-family:var(--font-display); }
  .result-chip .l{ font-size:11px; color:var(--ink-soft); font-weight:700; }

  /* Bottom nav */
  .bottom-nav{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:520px;
    background:linear-gradient(120deg, rgba(63,182,255,0.10), rgba(139,107,255,0.10) 50%, rgba(255,111,181,0.08)), var(--bg-card);
    box-shadow:0 -6px 24px rgba(80,90,200,0.14); display:flex; justify-content:space-around;
    padding:10px 6px 14px; z-index:20; border-radius:24px 24px 0 0;
  }
  .nav-btn{ background:none; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:10px; font-weight:800; color:var(--ink-soft); padding:6px 10px; border-radius:12px; }
  .nav-btn.active{ color:var(--purple-deep); background:linear-gradient(135deg,rgba(139,107,255,0.16),rgba(255,111,181,0.16)); }
  .nav-btn .ic{ font-size:20px; }

  /* Confetti canvas */
  #confetti-canvas{ position:fixed; inset:0; pointer-events:none; z-index:50; }

  .badge-row{ display:flex; gap:8px; overflow-x:auto; padding:6px 2px 10px; }
  .badge-pill{ flex:0 0 auto; background:linear-gradient(135deg,var(--yellow),var(--orange)); color:#4A3A00; font-weight:800; font-size:12px; padding:8px 14px; border-radius:16px; white-space:nowrap; }

  .lb-row{
    display:flex; align-items:center; gap:12px; padding:12px 10px; border-radius:14px; margin-bottom:8px;
    background:linear-gradient(135deg, rgba(45,212,200,0.12), rgba(255,201,60,0.10)), var(--bg-card);
    box-shadow:var(--shadow);
  }
  .profile-box{
    background:linear-gradient(150deg, #DFFBEE 0%, #C8F5DE 55%, #B4EFCF 100%) !important;
    border-color:rgba(30,150,90,0.22) !important;
  }
  .profile-box, .profile-box .val, .profile-box .lbl, .profile-box .lb-name, .profile-box .lb-xp, .profile-box div{ color:#0F5C36; }
  .profile-box .lb-xp{ color:#0E7A46; }

  .settings-box{
    background:linear-gradient(150deg, #FFE9F4 0%, #FFD6EA 55%, #FFC9E3 100%) !important;
    border-color:rgba(232,71,154,0.22) !important;
    color:#7A2F58;
  }
  .settings-box span, .settings-box div{ color:#7A2F58; }

  .lb-row.rank-row{
    background:linear-gradient(135deg, #1E3A66 0%, #142848 100%);
    border:2px solid rgba(63,182,255,0.35);
  }
  .lb-row.rank-row .lb-name{ color:#FFFFFF; }
  .lb-row.rank-row .lb-rank{ color:#FFC93C; }
  .lb-row.rank-row .lb-xp{ color:#7FD8FF; }
  .lb-rank{ font-family:var(--font-display); font-weight:700; width:26px; text-align:center; color:var(--purple-deep); }
  .lb-name{ flex:1; font-weight:800; }
  .lb-xp{ font-weight:800; color:var(--sky-deep); font-size:13px; }

  .loading-wrap{ text-align:center; padding:60px 20px; }
  .spinner{ width:56px; height:56px; border-radius:50%; border:6px solid rgba(139,107,255,0.15); border-top-color:var(--purple); margin:0 auto 18px; animation:spin 0.9s linear infinite; }
  @keyframes spin{ to{transform:rotate(360deg);} }

  .error-box{ background:rgba(255,107,107,0.1); color:var(--red); padding:12px 14px; border-radius:14px; font-weight:700; font-size:14px; margin-bottom:12px; }

  .toggle-row{ display:flex; justify-content:space-between; align-items:center; padding:14px 4px; border-bottom:1px solid rgba(139,107,255,0.1); }
  .switch{ width:46px; height:26px; border-radius:20px; background:rgba(139,107,255,0.2); position:relative; transition:background .2s ease; }
  .switch.on{ background:linear-gradient(135deg,var(--sky),var(--purple)); }
  .switch::after{ content:''; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:white; transition:left .2s ease; }
  .switch.on::after{ left:23px; }

  .section-title{ font-family:var(--font-display); font-weight:600; font-size:18px; margin:18px 0 10px; display:flex; align-items:center; gap:8px; }
  .section-title::before{ content:''; width:5px; height:18px; border-radius:4px; background:linear-gradient(180deg,var(--sky),var(--pink)); display:inline-block; }

  /* ===== Extra animations ===== */
  .video-btn{ background:linear-gradient(135deg,#FF7A7A,#E14545); color:white; }

<script>
/* ============ CONFIG ============ */
const SUBJECTS = [
  {id:'math', name:'Mathematics', icon:'🧮', color:'sky'},
  {id:'gk', name:'General Knowledge', icon:'🌍', color:'teal'},
  {id:'science', name:'Science', icon:'🔬', color:'green'},

const LEVEL_QUESTION_COUNTS = [10,15,20,25,30];
const CODING_LEVEL_COUNTS = [2,3,3,4,5];
const CODING_LANGUAGES = ['Python','JavaScript','Java','C','C++','HTML & CSS','SQL'];

function difficultyForAge(age){
  if(age<=7) return {label:'Very Easy', key:'very easy, using simple words and small numbers'};
  if(age<=10) return {label:'Easy', key:'easy, suitable for a curious child'};
  if(age<=13) return {label:'Medium', key:'medium difficulty, suitable for a middle-schooler'};
  if(age<=17) return {label:'Hard', key:'hard, suitable for a high-schooler'};
  return {label:'Advanced', key:'advanced, suitable for a young adult'};
}

/* ============ STATE ============ */
let state = {
  screen:'login',
  authTab:'login',

  progress:null,    // stored progress object
  quiz:null,        // {subject, level, questions, idx, correctCount, wrongCount, startTime, answered}
  lastResult:null,

  error:null,
};

/* ============ STORAGE HELPERS ============ */
async function loadProgress(username){
  try{
    const r = await window.storage.get('progress:'+username, false);
    const p = r ? JSON.parse(r.value) : defaultProgress();
    if(!p.seenQuestions) p.seenQuestions = {};
    return p;
  }catch(e){ return defaultProgress(); }
}
function defaultProgress(){
  return {
    xp:0, coins:50, streak:1, lastPlayDate:null,
    subjectProgress:{}, // subjectId -> {level, stars, completed}
    badges:[],
    seenQuestions:{}, // subjectId -> array of previously asked question texts
  };
}
async function saveProgress(){
  if(!state.user) return;
  await window.storage.set('progress:'+state.user.username, JSON.stringify(state.progress), false);
}
async function saveAccount(username, data){
  await window.storage.set('account:'+username, JSON.stringify(data), false);
}
async function loadAccount(username){
  try{
    const r = await window.storage.get('account:'+username, false);
    return r ? JSON.parse(r.value) : null;
  }catch(e){ return null; }
}
async function updateLeaderboard(){
  if(!state.user) return;
  try{
    await window.storage.set('leaderboard:'+state.user.username,
      JSON.stringify({name:state.user.name, xp:state.progress.xp}), true);
  }catch(e){}
}
async function fetchLeaderboard(){
  try{
    const list = await window.storage.list('leaderboard:', true);
    if(!list || !list.keys) return [];
    const entries = [];
    for(const k of list.keys){
      try{
        const r = await window.storage.get(k, true);
        if(r) entries.push(JSON.parse(r.value));
      }catch(e){}
    }
    entries.sort((a,b)=>b.xp-a.xp);
    return entries;
  }catch(e){ return []; }
}

/* ============ SOUND (WebAudio synth, no assets needed) ============ */
let actx;
function beep(freq, dur, type='sine', vol=0.15){
  if(!state.soundOn) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator(); const g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.value = vol;
    o.connect(g); g.connect(actx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.stop(actx.currentTime + dur);
  }catch(e){}
}
const sfx = {
  click: ()=>beep(500,0.06,'square',0.08),
  correct: ()=>{beep(660,0.1,'sine',0.15); setTimeout(()=>beep(880,0.15,'sine',0.15),90);},
  wrong: ()=>beep(160,0.25,'sawtooth',0.12),
  levelup: ()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.18,'sine',0.15), i*110));},
  whoosh: ()=>{beep(300,0.12,'sine',0.06); setTimeout(()=>beep(450,0.1,'sine',0.05),40);},

/* ============ AI QUIZ GENERATION ============ */
const AVATARS = ['🐼','🦊','🐯','🐸','🦁','🐨','🐰','🦄','🐙','🐧','🦉','🐢'];

/* ============ AI CALL HELPER ============
 * Inside Claude.ai's artifact preview, calling api.anthropic.com directly works
 * (a sandbox proxy injects the credentials for you). Once this app is hosted on
 * its own domain, that direct call is blocked by the browser (no API key can
 * safely live in client-side code). So: try the direct call first, and if it's
 * blocked, fall back to a same-origin /api/generate endpoint that YOUR OWN
 * server runs, holding the real Anthropic API key server-side. See the
 * included /api/generate.js + README for how to deploy that endpoint.
 */
async function callClaude(prompt, maxTokens){
  try {
    const response = await fetch("/api/generate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        prompt: prompt,
        max_tokens: maxTokens
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || `AI request failed (${response.status})`
      );
    }

    return (data.content || [])
      .map(block => block.text || "")
      .join("");

  } catch (error) {
    console.error("AI Quiz Error:", error);
    throw error;
  }
}

async function generateQuiz(subject, level, age, previousQuestions){
  const diff = difficultyForAge(age);
  const count = LEVEL_QUESTION_COUNTS[Math.min(level-1, LEVEL_QUESTION_COUNTS.length-1)];
  const seed = Math.random().toString(36).slice(2);
  const avoidList = (previousQuestions && previousQuestions.length)
    ? `\nDo NOT reuse any of these previously asked questions, and do NOT reuse their sentence patterns, openers, or structure (e.g. if a previous question started with "What is...", avoid starting new questions the same way):\n${previousQuestions.map(q=>'- '+q).join('\n')}\n`
    : '';
  const sys = `You are a quiz question generator for an educational kids/teens app called Little Lingo.
Generate exactly ${count} unique multiple-choice quiz questions about "${subject}" at ${diff.key} level.
Rules:
- Every question must have exactly 4 options.
- Only one option is correct.
- Include a short 1-sentence explanation for the correct answer.
- Vary question types across: factual recall, applied reasoning, and (where relevant to the subject) scenario or logic based questions.
- Actively vary sentence structure and phrasing between questions within this set too — do not start every question the same way (e.g. avoid making most questions begin with "What is..."). Mix direct questions, scenarios, "which of these...", fill-in-style stems, comparisons, and short mini-scenarios.
- Do not repeat the same question idea twice within this set.
- Keep language age-appropriate for the given difficulty level.
- Random seed for variety: ${seed}${avoidList}
Respond ONLY with a raw JSON array, no markdown fences, no preamble, no explanation outside the JSON. Format:
[{"question":"...", "options":["A","B","C","D"], "correctIndex":0, "explanation":"..."}]`;

  let text = await callClaude(sys, 4000);
  text = text.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
  const parsed = JSON.parse(text);
  if(!Array.isArray(parsed) || parsed.length===0) throw new Error('bad quiz payload');
  return parsed;
}

async function generateCodingChallenges(language, level, age, previousTitles){
  const diff = difficultyForAge(age);
  const count = CODING_LEVEL_COUNTS[Math.min(level-1, CODING_LEVEL_COUNTS.length-1)];
  const seed = Math.random().toString(36).slice(2);
  const avoidList = (previousTitles && previousTitles.length)
    ? `\nDo NOT reuse any of these previous challenge ideas or close variants of them:\n${previousTitles.map(t=>'- '+t).join('\n')}\n`
    : '';
  const sys = `You are a programming exercise generator for an educational kids/teens coding app called Little Lingo.
Generate exactly ${count} unique "write a program" coding challenges in ${language} at ${diff.key} level.
Rules:
- Each challenge should be small enough to solve in a few lines to ~20 lines of ${language}.
- Include clear step-by-step guidelines/constraints as a short bullet list (3-5 bullets) so the learner knows exactly what's expected.
- Include one short helpful "hint" sentence (an approach or concept to use) — NOT any actual code, and NOT the solution or part of it. The learner must write the entire program themselves from scratch.
- Vary the type of problem across the set: e.g. basic syntax practice, loops/conditionals, simple functions, string/number manipulation, small logic puzzles — whatever fits ${language} at this level.
- Keep language age-appropriate for the given difficulty level.
- Random seed for variety: ${seed}${avoidList}
Respond ONLY with a raw JSON array, no markdown fences, no preamble. Format:
[{"title":"...", "description":"...", "guidelines":["...","..."], "hint":"..."}]`;

  let text = await callClaude(sys, 4000);
  text = text.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
  const parsed = JSON.parse(text);
  if(!Array.isArray(parsed) || parsed.length===0) throw new Error('bad challenge payload');
  parsed.forEach(c=>{ c.question = c.title; }); // alias so seenQuestions tracking works generically
  return parsed;
}

async function evaluateCode(challenge, language, userCode){
  const sys = `You are a friendly, encouraging programming tutor AI reviewing a student's code submission for Little Lingo, an educational app.

Challenge title: ${challenge.title}
Challenge description: ${challenge.description}
Guidelines the student was given:
${(challenge.guidelines||[]).map(g=>'- '+g).join('\n')}
Language: ${language}

Student's submitted code:
\`\`\`
${userCode}
\`\`\`

Judge whether this code correctly and reasonably solves the challenge (minor style differences are fine; it does not need to be the single "best" solution, just correct and reasonably matching the guidelines).
Respond ONLY with raw JSON, no markdown fences, no preamble, in this exact format:
{"correct": true or false, "feedback": "one short encouraging sentence explaining what's right or wrong and how to fix it if needed"}`;

  let text = await callClaude(sys, 500);
  text = text.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
  return JSON.parse(text);
}

  canvas.innerHTML = '';

                : ['#3ECF8E','#3FB6FF'];
  const count = tier==='gold'?70:tier==='silver'?40:20;
  for(let i=0;i<count;i++){
    const el = document.createElement('div');
    const size = 6+Math.random()*8;
    el.style.cssText = `position:absolute; top:-20px; left:${Math.random()*100}%; width:${size}px; height:${size*0.5}px;
      background:${colors[Math.floor(Math.random()*colors.length)]}; opacity:0.9; border-radius:2px;
      transform:rotate(${Math.random()*360}deg);
      animation: confettifall ${1.8+Math.random()*1.6}s ease-in ${Math.random()*0.5}s forwards;`;
    canvas.appendChild(el);
  }
  if(!document.getElementById('confetti-style')){
    const style = document.createElement('style');
    style.id='confetti-style';
    style.textContent = `@keyframes confettifall{ to{ transform:translateY(110vh) rotate(400deg); opacity:0.2; } }`;
    document.head.appendChild(style);
  }
  setTimeout(()=>{canvas.innerHTML='';}, 4000);
}

/* ============ RENDER ============ */
function render(){
  try{
    renderInner();
  }catch(e){
    console.error('Render error caught:', e);
    showRecoveryScreen(e);

}

function renderInner(){
  const app = document.getElementById('app');
  document.body.className = state.darkMode ? 'dark' : '';
  let html = '';
  if(state.screen==='login') html = renderLogin();
  else if(state.screen==='home') html = renderShell(renderHome());

  else if(state.screen==='profile') html = renderShell(renderProfile());
  else if(state.screen==='leaderboard') html = renderShell(renderLeaderboardScreen());
  else if(state.screen==='settings') html = renderShell(renderSettings());

/* ============ Password strength + generator ============ */
function passwordScore(pw){
  if(!pw) return 0;
  let score = 0;
  if(pw.length>=8) score++;
  if(pw.length>=12) score++;
  if(/[a-z]/.test(pw) && /[A-Z]/.test(pw)) score++;
  if(/[0-9]/.test(pw)) score++;
  if(/[^a-zA-Z0-9]/.test(pw)) score++;
  return Math.min(score,4); // 0-4
}
function pwStrengthClass(){
  const pw = document.getElementById('rg-password') ? document.getElementById('rg-password').value : '';
  const s = passwordScore(pw);
  return ['pw-empty','pw-weak','pw-fair','pw-good','pw-strong'][s];
}
function pwStrengthLabel(){
  const pw = document.getElementById('rg-password') ? document.getElementById('rg-password').value : '';
  if(!pw) return 'Use 8+ characters with letters, numbers &amp; symbols';
  const s = passwordScore(pw);
  return ['','Weak — try adding more characters','Fair — add a number or symbol','Good!','Strong password 💪'][s];
}
function updatePasswordStrengthUI(){
  const fill = document.getElementById('pw-strength-fill');
  const label = document.getElementById('pw-strength-label');
  if(fill){ fill.className = 'pw-strength-fill '+pwStrengthClass(); }
  if(label){ label.innerHTML = pwStrengthLabel(); }
}
function onPasswordInput(){
  updatePasswordStrengthUI();
  // typing a custom password retires the generated one shown earlier, without a full re-render
  // (a full render would recreate these uncontrolled inputs and wipe what's mid-typing)
  if(state.generatedPassword){
    state.generatedPassword = null;
    const box = document.getElementById('generated-pw-box');
    if(box) box.style.display='none';
  }
}
function togglePasswordVisibility(){
  sfx.click();
  state.showPassword = !state.showPassword;
  const pwField = document.getElementById('rg-password');
  const confirmField = document.getElementById('rg-confirm');
  const eyeBtn = document.querySelector('.pw-eye');
  const newType = state.showPassword ? 'text' : 'password';
  if(pwField) pwField.type = newType;
  if(confirmField) confirmField.type = newType;
  if(eyeBtn) eyeBtn.textContent = state.showPassword ? '🙈' : '👁️';
}
function generateStrongPassword(){
  sfx.click();
  const lowers='abcdefghijkmnpqrstuvwxyz', uppers='ABCDEFGHJKLMNPQRSTUVWXYZ', digits='23456789', symbols='!@#$%&*?';
  const all = lowers+uppers+digits+symbols;
  function pick(chars){ return chars[Math.floor(Math.random()*chars.length)]; }
  let pw = [pick(lowers), pick(uppers), pick(digits), pick(symbols)];
  for(let i=0;i<8;i++) pw.push(pick(all));
  pw = shuffleArr(pw).join('');

  // Snapshot other in-progress fields so the re-render (needed to reveal the password box) doesn't wipe them
  const fieldIds = ['rg-name','rg-username','rg-age','rg-school'];
  const snapshot = {};
  fieldIds.forEach(id=>{ const el = document.getElementById(id); if(el) snapshot[id] = el.value; });

  state.generatedPassword = pw;
  state.showPassword = true;
  render();

  fieldIds.forEach(id=>{ const el = document.getElementById(id); if(el && snapshot[id]!==undefined) el.value = snapshot[id]; });
  const pwField = document.getElementById('rg-password');
  const confirmField = document.getElementById('rg-confirm');
  if(pwField) pwField.value = pw;
  if(confirmField) confirmField.value = pw;
  updatePasswordStrengthUI();
}

async function doLogin(){
  const username = document.getElementById('li-username').value.trim();
  const password = document.getElementById('li-password').value;
  if(!username || !password){ state.error='Please fill in both fields.'; render(); return; }
  const acc = await loadAccount(username);
  if(!acc || acc.password !== password){ state.error='Incorrect username or password.'; render(); return; }
  state.user = {username, name:acc.name, age:acc.age, school:acc.school, avatar:acc.avatar||'🐼'};
  state.progress = await loadProgress(username);
  bumpStreak();
  state.error=null; state.screen='home';
  render(); saveProgress(); updateLeaderboard();
}

async function doRegister(){
  const name = document.getElementById('rg-name').value.trim();
  const username = document.getElementById('rg-username').value.trim();
  const age = parseInt(document.getElementById('rg-age').value,10);
  const school = document.getElementById('rg-school').value.trim();
  const pw = document.getElementById('rg-password').value;
  const pw2 = document.getElementById('rg-confirm').value;
  if(!name || !username || !age || !pw){ state.error='Please fill in all required fields.'; render(); return; }
  if(age<5 || age>25){ state.error='Age must be between 5 and 25.'; render(); return; }
  if(pw !== pw2){ state.error='Passwords do not match.'; render(); return; }
  const existing = await loadAccount(username);
  if(existing){ state.error='That username is already taken.'; render(); return; }
  const avatar = state.pendingAvatar || AVATARS[Math.floor(Math.random()*AVATARS.length)];
  await saveAccount(username, {name, age, school, password:pw, avatar});
  state.user = {username, name, age, school, avatar};
  state.progress = defaultProgress();
  await saveProgress();
  state.error=null; state.pendingAvatar=null; state.screen='home';
  render(); updateLeaderboard();
}

function bumpStreak(){
  const today = new Date().toDateString();
  if(state.progress.lastPlayDate === today) return;
  const yesterday = new Date(Date.now()-86400000).toDateString();
  if(state.progress.lastPlayDate === yesterday) state.progress.streak += 1;
  else if(state.progress.lastPlayDate !== today) state.progress.streak = 1;
  state.progress.lastPlayDate = today;
}

  if(subjectId==='programming'){
    state.pendingCodingSubjectId = subjectId;
    state.screen='coding-lang';
    render();

  }
  const sp = state.progress.subjectProgress[subjectId] || {level:1, stars:0};
  state.screen='quiz';
  state.loading = true;
  state.loadingType = 'mcq';
  state.error = null;

  try{
    const seen = (state.progress.seenQuestions && state.progress.seenQuestions[subjectId]) || [];

    state.quiz = {
      type:'mcq',

    render();
  }
}


function shuffleArr(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function renderQuiz(){
  if(state.loading){
    const isCoding = state.loadingType==='coding';
    return `<div class="screen loading-wrap">
      <div class="spinner"></div>

      <div style="color:var(--ink-soft); font-weight:700; margin-top:6px;">Fresh ${isCoding?'programs':'questions'}, every single time!</div>
    </div>`;
  }
  if(state.quiz && state.quiz.type==='coding') return renderCodingChallenge();
  const q = state.quiz;
  const question = q.questions[q.idx];
  const progressPct = (q.idx/q.questions.length)*100;
  const optionLetters = ['A','B','C','D'];
  return `
  <div class="screen">
    <div class="quiz-header">
      <span>${q.subjectName} · Level ${q.level}</span>
      <span>${q.idx+1} / ${q.questions.length}</span>

         <div class="explain-box">💡 ${escapeHtml(question.explanation||'')}</div>`

      <button class="btn btn-primary" style="margin-top:14px;" onclick="nextQuestion()">
        ${q.idx+1 < q.questions.length ? 'Next Question →' : 'See My Results 🎉'}

      ${result.correct ?
        `<div class="result-banner correct-banner">✅ Correct! Nice one!</div>`
        :
        `<div class="result-banner wrong-banner">❌ Not quite!</div>

function escJs(s){
  return String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');
}
function watchVideo(language, topic){
  sfx.click();

  sfx.click();

  render();

async function submitCode(){
  const q = state.quiz;
  if(q.evaluating || q.answered) return;
  q.evaluating = true;
  render();
  const ch = q.questions[q.idx];
  try{
    const verdict = await evaluateCode(ch, state.codingLanguage, q.code);
    q.evaluating = false;
    q.answered = verdict;
    if(verdict.correct){ q.correctCount++; sfx.correct(); } else { q.wrongCount++; sfx.wrong(); }
    render();
  }catch(e){
    q.evaluating = false;
    q.answered = {correct:false, feedback:"Couldn't reach the AI reviewer — give it another try!"};
    render();
  }
}

function nextChallenge(){
  const q = state.quiz;
  if(q.idx+1 < q.questions.length){
    q.idx++; q.answered=null; q.questionStart = Date.now();
    q.code = '';
    q.hintShown = false;
    render();
  } else {
    finishQuiz();
  }
}

function escapeHtml(s){
  return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function answerQuestion(i){
  const q = state.quiz;
  if(q.answered !== null) return;
  const question = q.questions[q.idx];
  q.answered = i;
  const correct = i === question.correctIndex;
  if(correct){ q.correctCount++; sfx.correct(); } else { q.wrongCount++; sfx.wrong(); }
  render();
}

function nextQuestion(){
  const q = state.quiz;
  if(q.idx+1 < q.questions.length){
    q.idx++; q.answered=null; q.questionStart = Date.now();
    render();
  } else {
    finishQuiz();
  }
}

async function finishQuiz(){
  const q = state.quiz;
  const total = q.questions.length;
  const pct = Math.round((q.correctCount/total)*100);
  const timeTakenSec = Math.round((Date.now()-q.startTime)/1000);
  let tier, xpGain, coinGain, stars;
  if(pct>=95){ tier='gold'; xpGain=total*12; coinGain=total*4; stars=3; }
  else if(pct>=80){ tier='silver'; xpGain=total*9; coinGain=total*3; stars=2; }
  else if(pct>=60){ tier='bronze'; xpGain=total*6; coinGain=total*2; stars=1; }
  else { tier='try-again'; xpGain=total*3; coinGain=total; stars=0; }

  const sp = state.progress.subjectProgress[q.subjectId] || {level:1, stars:0};
  const advancedLevel = sp.level < LEVEL_QUESTION_COUNTS.length;
  state.progress.subjectProgress[q.subjectId] = {
    level: advancedLevel ? sp.level+1 : sp.level,
    stars: Math.max(sp.stars, stars),
    completed: true,
  };

  // Remember these questions so future quizzes for this subject don't repeat them or their patterns
  if(!state.progress.seenQuestions) state.progress.seenQuestions = {};
  const priorSeen = state.progress.seenQuestions[q.subjectId] || [];
  const newlySeen = q.questions.map(qq=>qq.question);
  state.progress.seenQuestions[q.subjectId] = [...priorSeen, ...newlySeen].slice(-60);
  state.progress.xp += xpGain;
  state.progress.coins += coinGain;
  let earnedNewBadge = false;
  if(pct>=95 && !state.progress.badges.includes(q.subjectName+' Champion')){
    state.progress.badges.push(q.subjectName+' Champion');
    earnedNewBadge = true;
  }
  if(pct===100 && !state.progress.badges.includes('Perfectionist')){
    state.progress.badges.push('Perfectionist');
    earnedNewBadge = true;
  }
  await saveProgress();
  await updateLeaderboard();

  state.lastResult = {
    subjectId:q.subjectId, subjectName:q.subjectName, tier, pct, xpGain, coinGain, stars,
    correct:q.correctCount, wrong:q.wrongCount, total,
    timeTakenSec, avgTime: Math.round(timeTakenSec/total),
    leveledUp: advancedLevel,
  };
  state.screen='result';
  render();
  setTimeout(()=>fireConfetti(tier), 150);
  if(earnedNewBadge) setTimeout(()=>sfx.badge(), 250);
  else if(tier==='gold' || tier==='silver') sfx.levelup();
  else sfx.coin();
}

function renderResult(){
  const r = state.lastResult;
  const tierInfo = {
    gold:{emoji:'🏆', title:"Outstanding! You're a Little Lingo Champion!", color:'var(--yellow)'},
    silver:{emoji:'🥈', title:'Silver Star Performance!', color:'#C9CEDA'},
    bronze:{emoji:'🎊', title:'Nice work — keep it up!', color:'var(--green)'},
    'try-again':{emoji:'💪', title:"Good try! Let's practice a bit more.", color:'var(--orange)'},
  }[r.tier];
  return `
  <div class="screen">
    <span class="trophy">${tierInfo.emoji}</span>
    <div class="score-big">${r.pct}%</div>
    <div class="score-sub">${tierInfo.title}</div>
    <div class="card" style="text-align:center; margin-bottom:10px;">
      <div style="font-weight:800; font-family:var(--font-display); font-size:16px;">
        +${r.xpGain} XP &nbsp; · &nbsp; +${r.coinGain} <span class="coin-ic">🪙</span> &nbsp; · &nbsp; ${'⭐'.repeat(r.stars)}${r.stars===0?'—':''}
      </div>
      ${r.leveledUp ? `<div style="color:var(--green); font-weight:800; margin-top:6px;">🔓 Next level unlocked!</div>` : ''}
    </div>
    <div class="result-grid">
      <div class="result-chip" style="animation-delay:0s"><div class="n">${r.correct}/${r.total}</div><div class="l">Correct</div></div>
      <div class="result-chip" style="animation-delay:0.06s"><div class="n">${r.wrong}</div><div class="l">Wrong</div></div>
      <div class="result-chip" style="animation-delay:0.12s"><div class="n">${r.timeTakenSec}s</div><div class="l">Time Taken</div></div>
      <div class="result-chip" style="animation-delay:0.18s"><div class="n">${r.avgTime}s</div><div class="l">Avg / Question</div></div>
    </div>
    <button class="btn btn-primary" onclick="sfx.click();go('subjects')">Play Another Subject</button>
    <button class="btn btn-ghost" onclick="sfx.click();go('home')">Back to Home</button>
  </div>`;
}

function renderProfile(){
  const p = state.progress;
  const level = Math.floor(p.xp/200)+1;
  const subjectsPlayed = Object.keys(p.subjectProgress).length;
  return `
  <div class="screen">
    <h2>Profile</h2>
    <div class="card profile-box" style="text-align:center; margin-top:12px;">
      <div class="profile-avatar-big" onclick="sfx.click();go('settings')">${state.user.avatar || '🐼'}</div>
      <div style="font-weight:800; font-size:19px;">${state.user.name}</div>
      <div style="font-weight:700; font-size:13px;">Age ${state.user.age} ${state.user.school?'· '+state.user.school:''}</div>
      <div style="font-weight:800; font-size:11px; margin-top:6px;">Tap avatar to change it in Settings →</div>
    </div>
    <div class="stat-grid">
      <div class="stat-chip profile-box"><div class="val">${level}</div><div class="lbl">Current Level</div></div>
      <div class="stat-chip profile-box"><div class="val">${p.xp}</div><div class="lbl">Total XP</div></div>
      <div class="stat-chip profile-box"><div class="val">${p.coins}</div><div class="lbl">Coins</div></div>
      <div class="stat-chip profile-box"><div class="val">${subjectsPlayed}</div><div class="lbl">Subjects Played</div></div>
    </div>
    <div class="section-title">Badges</div>
    ${p.badges.length ? `<div class="badge-row">${p.badges.map(b=>`<div class="badge-pill">🏅 ${b}</div>`).join('')}</div>` : `<div style="color:var(--ink-soft); font-weight:700; font-size:13px;">No badges yet — score 95%+ on a quiz to earn one!</div>`}
    <div class="section-title">Subject Progress</div>
    ${Object.entries(p.subjectProgress).length===0 ? `<div style="color:var(--ink-soft); font-weight:700; font-size:13px;">Play a quiz to see your progress here.</div>` :
      Object.entries(p.subjectProgress).map(([id,sp])=>{
        const s = SUBJECTS.find(x=>x.id===id);
        return `<div class="lb-row profile-box"><div style="font-size:20px;">${s?s.icon:'📘'}</div><div class="lb-name">${s?s.name:id}</div><div class="lb-xp">Lv ${sp.level} · ${'⭐'.repeat(sp.stars)}</div></div>`;
      }).join('')}
    <button class="btn btn-ghost" style="margin-top:16px; color:var(--red);" onclick="logout()">Log Out</button>
  </div>`;
}

function renderLeaderboardScreen(){
  return `
  <div class="screen">
    <h2>Leaderboard 🏆</h2>
    <div style="color:var(--ink-soft); font-weight:700; font-size:13px; margin-bottom:12px;">Ranked by total XP · All players</div>
    <div id="lb-list"><div class="loading-wrap"><div class="spinner"></div></div></div>
  </div>`;
}
async function populateLeaderboard(){
  const entries = await fetchLeaderboard();
  const el = document.getElementById('lb-list');
  if(!el) return;
  if(entries.length===0){ el.innerHTML = `<div style="color:var(--ink-soft); font-weight:700;">No players yet — be the first!</div>`; return; }
  el.innerHTML = entries.slice(0,50).map((e,i)=>`
    <div class="lb-row rank-row" style="animation-delay:${Math.min(i,10)*0.05}s">
      <div class="lb-rank">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</div>
      <div class="lb-name">${escapeHtml(e.name)}</div>
      <div class="lb-xp">${e.xp} XP</div>
    </div>`).join('');
}

function renderSettings(){
  return `
  <div class="screen">
    <h2>Settings</h2>
    <div class="section-title" style="margin-top:12px;">Your Avatar</div>
    <div class="card settings-box">
      <div class="avatar-picker">
        ${AVATARS.map(a=>`<button type="button" class="avatar-option ${(state.user.avatar||'🐼')===a?'selected':''}" onclick="changeAvatar('${a}')">${a}</button>`).join('')}
      </div>
    </div>
    ${state.canInstall ? `
      <div class="card settings-box" style="margin-top:12px; text-align:center;">
        <div style="font-weight:800; margin-bottom:8px;">📲 Get the App</div>
        <div style="font-size:13px; font-weight:700; margin-bottom:12px;">Install Little Lingo on this device — works like a real app, right from your home screen.</div>
        <button class="btn btn-secondary" onclick="installApp()">Install App</button>
      </div>
    ` : ''}
    <div class="card settings-box" style="margin-top:12px;">
      <div class="toggle-row"><span>🌙 Dark Mode</span>
        <div class="switch ${state.darkMode?'on':''}" onclick="toggleSetting('darkMode')"></div>
      </div>
      <div class="toggle-row"><span>🔊 Sound Effects</span>
        <div class="switch ${state.soundOn?'on':''}" onclick="toggleSetting('soundOn')"></div>
      </div>
    </div>
    <div class="section-title">About</div>
    <div class="card settings-box" style="font-size:13px; font-weight:700; line-height:1.6;">
      Little Lingo generates a brand-new quiz with AI every time you play, so questions never repeat.
      Difficulty auto-adjusts to your age and your recent scores raise or ease the challenge over time.
    </div>
  </div>`;
}
function toggleSetting(key){
  state[key] = !state[key];
  sfx.toggle();
  render();
}
async function changeAvatar(a){
  sfx.select();
  state.user.avatar = a;
  render();
  if(state.user.username && !state.user.username.startsWith('guest_')){
    const acc = await loadAccount(state.user.username);
    if(acc){ acc.avatar = a; await saveAccount(state.user.username, acc); }
  }
}

function logout(){
  state.user=null; state.progress=null; state.quiz=null; state.screen='login'; state.authTab='login';
  render();
}

/* ============ PWA: install + service worker ============ */
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  state.canInstall = true;
  if(state.screen==='settings') render();
});
async function installApp(){
  if(!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  state.canInstall = false;
  render();
}
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

render();
</script>
</body>
</html>
